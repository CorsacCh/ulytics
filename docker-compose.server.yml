# SERVIDOR — descarga las imagenes de GHCR, NO construye.
# NO publica puertos: Caddy (contenedor en red_taller_software) llega por container_name:
#   prueba.146.83.216.166.nip.io/api/*  ->  grupo0_backend:4000
#   prueba.146.83.216.166.nip.io/*      ->  grupo0_frontend:3000
# El .env vive SOLO en el servidor, junto a este archivo. Lo sube deploy.sh como docker-compose.yml.

# version explícita: el servidor tiene un Compose viejo que la exige.
# (Compose v2 moderno la ignora con un warning inofensivo.)
version: "3.8"

services:
  grupo4_db:
    image: postgres:17
    container_name: grupo4_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - red_taller_software

  grupo4_backend:
    image: ghcr.io/CorsacCh/ULYTICS-backend:latest
    container_name: grupo4_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo4_db
    networks:
      - red_taller_software

  grupo4_frontend:
    image: ghcr.io/CorsacCh/ULYTICS-frontend:latest
    container_name: grupo4_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo4_backend
    networks:
      - red_taller_software

volumes:
  data:

networks:
  red_taller_software:
    external: true
