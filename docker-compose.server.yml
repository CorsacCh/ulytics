# SERVIDOR DEL GRUPO 4
#
# Descarga imágenes desde GHCR; no construye código en el servidor.
# No publica puertos del host. El proxy compartido debe dirigir únicamente:
#   /api/* -> grupo4_backend:4004
#   /*     -> grupo4_frontend:3004
#
# Los tres archivos de entorno viven solo en el servidor:
# database/.env, backend/.env y frontend/.env.

services:
  grupo4_db:
    image: postgres:17
    container_name: grupo4_db
    restart: unless-stopped
    env_file:
      - ./database/.env
    volumes:
      - grupo4_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grupo4_internal

  grupo4_backend:
    image: ghcr.io/corsacch/ulytics-backend:latest
    container_name: grupo4_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      grupo4_db:
        condition: service_healthy
    networks:
      - grupo4_internal
      - red_taller_software

  grupo4_frontend:
    image: ghcr.io/corsacch/ulytics-frontend:latest
    container_name: grupo4_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - grupo4_backend
    networks:
      - red_taller_software

volumes:
  grupo4_postgres_data:
    name: grupo4_ulytics_postgres_data

networks:
  grupo4_internal:
    name: grupo4_ulytics_server_network
    driver: bridge
  red_taller_software:
    external: true
