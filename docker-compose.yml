# LOCAL — construye las imagenes y publica los puertos en localhost.
#   Frontend -> http://localhost:3000    Backend -> http://localhost:4000
#   Uso:  cp .env.example .env  &&  docker compose up --build

services:
  grupo0_db:
    image: postgres
    container_name: grupo4_db
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - red_taller_software

  grupo4_backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: grupo4_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo4_db
    ports:
      - "4000:4004"
    networks:
      - red_taller_software

  grupo4_frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    container_name: grupo0_frontend
    restart: unless-stopped
    env_file: .env
    depends_on:
      - grupo4_backend
    ports:
      - "3000:3004"
    networks:
      - red_taller_software

volumes:
  data:

networks:
  red_taller_software:
    driver: bridge
