# LOCAL — construye las imágenes y publica únicamente puertos locales.
#   Frontend  -> http://localhost:3004
#   Backend   -> http://localhost:4004
#   PostgreSQL-> localhost:5434 (solo para herramientas locales)
#
# Antes de levantar los servicios, crea los archivos de entorno a partir de
# los ejemplos ubicados dentro de database/, backend/ y frontend/.

services:
  grupo4_db:
    image: postgres:17
    container_name: grupo4_db
    restart: unless-stopped
    env_file:
      - ./database/.env
    volumes:
      - grupo4_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - grupo4_ulytics

  grupo4_backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grupo4_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      grupo4_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4004:4004"
    networks:
      - grupo4_ulytics

  grupo4_frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: grupo4_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - grupo4_backend
    ports:
      - "127.0.0.1:3004:3004"
    networks:
      - grupo4_ulytics

volumes:
  grupo4_postgres_data:
    name: grupo4_ulytics_postgres_data

networks:
  grupo4_ulytics:
    name: grupo4_ulytics_network
    driver: bridge
