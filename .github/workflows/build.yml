name: Construir y publicar imagenes

# En cada push a main construye las imagenes de backend y frontend
# y las publica en GHCR (GitHub Container Registry).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend -> ghcr.io/corsacch/ulytics-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/corsacch/ulytics-backend:latest

      - name: frontend -> ghcr.io/corsacch/ulytics-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/dockerfile
          push: true
          tags: ghcr.io/corsacch/ulytics-frontend:latest
